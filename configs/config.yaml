# Tennis-Vision Configuration
# All tunable parameters live here — no magic numbers in code.
# CLI override: python main.py --config my_config.yaml
# Per-parameter: --input, --output, --no-stubs, --fast, --debug

pipeline:
  per_frame_keypoints: true   # Per-frame court keypoints (camera-robust, slower)
  use_bytetrack: true          # ByteTrack Kalman smoother for ball trajectory
  shot_classification: true    # Enable shot type classification
  use_homography: true         # Real perspective homography (vs. nearest-keypoint approx)
  use_tracknet: true          # true = TrackNet v2 ball detector; false = YOLO (set true after weights downloaded)

models:
  player: "yolov8x"
  ball: "models/last.pt"
  court: "models/keypoints_model.pth"
  tracknet: "models/tracknet.pt"    # download: gdown --id 1XEYZ4myUN7QT-NeBYJI0xteLsvs-ZAOl -O models/tracknet.pt

io:
  input_video: "input_videos/input_video_2.mp4"
  output_video: "output/videos/output_video.avi"   # processed video
  output_frames_dir: "output/frames"               # extracted frame JPEGs
  output_stats_dir: "output/stats"                 # CSV + JSON per run
  log_dir: "logs"                                  # run_<timestamp>.log
  player_stub_path: "tracker_stubs/player_detections.pkl"
  ball_stub_bytetrack_path: "tracker_stubs/ball_detections_tracked.pkl"
  ball_stub_path: "tracker_stubs/ball_detections.pkl"
  tracknet_stub_path: "tracker_stubs/ball_detections_tracknet.pkl"

stubs:
  use_player_stubs: true    # true = load from disk (fast dev), false = rerun YOLO
  use_ball_stubs: true      # true = load cached TrackNet detections (fast rerender; set false to re-run detection)

detection:
  player_confidence: 0.7
  ball_confidence: 0.6
  shot_player_distance_px: 300  # ball must be within this many px of a player to count as a shot (not a bounce)

shot_classifier:
  volley_distance_threshold: 40   # px from net on mini-court (was 150 — was broken)
  smash_height_threshold: 0.7     # ball_y delta > this fraction of mini-court height
  net_y_position_relative: 0.5    # net sits at 50% of mini-court height

logging:
  level: "INFO"          # DEBUG | INFO | WARNING
  write_to_file: true    # also write to logs/run_<timestamp>.log
